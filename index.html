<script>
    function updateTime() {
        const now = new Date().toLocaleString('en-US', {
            timeZone: 'Asia/Colombo',
            year: 'numeric',
            month: 'short',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: true,
        });
        document.getElementById('srilankaTime').textContent = now;
    }
    updateTime();
    setInterval(updateTime, 1000);

    // Wait for the DOM to be fully loaded
    document.addEventListener('DOMContentLoaded', () => {
        const warning = document.getElementById('size-warning');

        if (warning) {
            // Start the timer for 5 seconds (5000ms)
            setTimeout(() => {
                // First, fade it out using Tailwind's opacity-0
                warning.classList.add('opacity-0');

                // Then, after the fade animation finishes (1s), remove it from the layout
                setTimeout(() => {
                    warning.style.display = 'none';
                }, 1000);
            }, 5000);
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        // Select all elements you want to animate
        const elements = document.querySelectorAll('.fade-in-element');

        elements.forEach((el, index) => {
            setTimeout(() => {
                el.classList.remove('opacity-0', 'translate-y-4');
                el.classList.add('opacity-100', 'translate-y-0');
            }, index * 150); // 150ms delay between each element
        });
    });

    document.addEventListener('DOMContentLoaded', () => {
        const wordElement = document.getElementById('rotating-word');
        const words = ['impact', 'purpose', 'meaning', 'clarity', 'character'];
        let currentIndex = 0;

        setInterval(() => {
            // Increment index and loop back to 0 using modulo
            currentIndex = (currentIndex + 1) % words.length;

            // Simple fade-out and fade-in effect
            wordElement.style.opacity = 0;

            setTimeout(() => {
                wordElement.textContent = words[currentIndex];
                wordElement.style.opacity = 1;
            }, 500); // Wait for fade out before changing text
        }, 4000); // 3000ms = 3 seconds
    });
</script>
