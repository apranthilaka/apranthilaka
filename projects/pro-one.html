<script>
    // Wait for the DOM to be fully loaded
    document.addEventListener('DOMContentLoaded', () => {
        const warning = document.getElementById('size-warning');

        if (warning) {
            // Start the timer for 5 seconds (5000ms)
            setTimeout(() => {
                // First, fade it out using Tailwind's opacity-0
                warning.classList.add('opacity-0');

                // Then, after the fade animation finishes (1s), remove it from the layout
                setTimeout(() => {
                    warning.style.display = 'none';
                }, 100);
            }, 5000);
        }
    });
</script>
